name: Arthur AI Dev - Python tests

on:
  push:
    paths:
      - 'arthur/**'
      - '.github/workflows/arthur-python-tests.yml'
      - 'launcher/scripts/mac-signature.cjs'
      - 'launcher/scripts/package.cjs'
      - 'launcher/tests/mac-signature.test.cjs'
  pull_request:
    paths:
      - 'arthur/**'
      - '.github/workflows/arthur-python-tests.yml'
      - 'launcher/scripts/mac-signature.cjs'
      - 'launcher/scripts/package.cjs'
      - 'launcher/tests/mac-signature.test.cjs'

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compilar exemplos
        run: python -m compileall -q arthur
      - name: Rodar testes
        run: python -m unittest discover -s arthur/portfolio/monitor_inbox/tests -v
      - name: Testar política de assinatura macOS
        run: node --test launcher/tests/mac-signature.test.cjs
